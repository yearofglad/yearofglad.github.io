<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <meta name="theme-color" content="#f2dedd">
    <title>{% if page.title and page.url != "/" %}{{ page.title }} — {% endif %}Ben Fu</title>
    <meta name="description" content="Ben Fu — MSCS student at Columbia University, interested in technology, HCI, and design.">
